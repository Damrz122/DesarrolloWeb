# Complementa prod; no cambia Docker local ni necesita un archivo .env en la imagen.
spring:
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    validate-on-migrate: true
  data:
    redis:
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:true}
      connect-timeout: 5s
      timeout: 5s
      lettuce:
        shutdown-timeout: 100ms
server:
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 30
      min-spare: 2
    max-connections: 200
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,redis
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:${RENDER_EXTERNAL_URL}}
  demo-seed:
    secure: ${DEMO_SEED_SECURE:true}
