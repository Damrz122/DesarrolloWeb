<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos — NovaStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/output.css">
    <!-- SockJS & StompJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

    <header id="main-navbar"></header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full">
        <div class="mb-8">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Historial de Mis Pedidos</h1>
            <p class="text-sm text-slate-400 mt-1">Consulta el progreso, estado de despacho y detalles de tus compras</p>
        </div>

        <div id="orders-container" class="space-y-4">
            <!-- Esqueleto -->
            <div class="py-16 text-center text-slate-500">
                <div class="w-10 h-10 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-sm">Cargando tu historial de compras...</p>
            </div>
        </div>
    </main>

    <!-- Modal Detalle del Pedido -->
    <div id="order-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="glass-panel w-full max-w-2xl rounded-3xl border border-slate-800 shadow-2xl p-6 sm:p-8 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
                <div>
                    <h3 id="modal-order-title" class="text-lg font-bold text-white">Detalle de Pedido</h3>
                    <span id="modal-order-date" class="text-xs text-slate-400"></span>
                </div>
                <button id="modal-close-btn" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div id="modal-order-content" class="space-y-4 text-sm">
                <!-- Dinámico -->
            </div>
        </div>
    </div>

    <footer class="border-t border-slate-800/80 bg-slate-950 py-8 mt-16 text-center text-xs text-slate-500">
        <p>© 2026 NovaStore. Compra protegida y segura.</p>
    </footer>

    <script type="module">
        import { api } from '/assets/js/api.js';
        import { auth } from '/assets/js/auth.js';
        import { renderNavbar } from '/assets/js/ui/navbar.js';
        import { showToast } from '/assets/js/ui/toast.js';

        renderNavbar();

        if (!auth.protegerRutaAutenticada()) {
            // Se redirige en auth.js
        } else {
            cargarPedidos();
        }

        const container = document.getElementById('orders-container');
        const modal = document.getElementById('order-modal');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const modalTitle = document.getElementById('modal-order-title');
        const modalDate = document.getElementById('modal-order-date');
        const modalContent = document.getElementById('modal-order-content');

        modalCloseBtn.addEventListener('click', () => modal.classList.add('hidden'));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.add('hidden');
        });

        async function cargarPedidos() {
            try {
                const res = await api.get('/api/pedidos/mios');
                if (!res.exito || !res.datos || res.datos.length === 0) {
                    container.innerHTML = `
                        <div class="glass-panel rounded-3xl p-12 text-center max-w-xl mx-auto border border-slate-800">
                            <div class="w-16 h-16 rounded-2xl bg-slate-800/80 text-slate-400 flex items-center justify-center mx-auto mb-4">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                            </div>
                            <h2 class="text-xl font-bold text-white mb-2">No tienes pedidos registrados</h2>
                            <p class="text-sm text-slate-400 mb-6">Cuando realices compras en nuestra tienda, podrás ver el seguimiento en esta sección.</p>
                            <a href="/index.html" class="inline-flex items-center px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition-all shadow-lg shadow-indigo-600/30">
                                Ir a Comprar
                            </a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = '';
                res.datos.forEach(p => {
                    const badge = obtenerBadgeEstado(p.estado);
                    const fecha = new Date(p.fecha).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
                    const total = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }).format(p.total);

                    const card = document.createElement('div');
                    card.className = 'glass-panel p-5 sm:p-6 rounded-2xl border border-slate-800/90 hover:border-slate-700 transition-all flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4';

                    card.innerHTML = `
                        <div class="space-y-1">
                            <div class="flex items-center space-x-3">
                                <span class="font-extrabold text-white text-base">Orden #${p.id}</span>
                                ${badge}
                            </div>
                            <p class="text-xs text-slate-400">Fecha de compra: ${fecha}</p>
                            <p class="text-xs text-slate-400">Destino: <span class="text-slate-300">${p.direccionEnvio || 'No especificada'}</span></p>
                        </div>

                        <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto space-x-6">
                            <div class="text-right">
                                <span class="text-xs text-slate-500 block">Total</span>
                                <span class="text-lg font-black text-indigo-400">${total}</span>
                            </div>
                            <button class="btn-ver-detalle px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700 transition-colors" data-id="${p.id}">
                                Ver Artículos
                            </button>
                        </div>
                    `;

                    const btnVer = card.querySelector('.btn-ver-detalle');
                    btnVer.addEventListener('click', () => abrirDetalleModal(p));

                    container.appendChild(card);
                });

            } catch (err) {
                container.innerHTML = `<div class="py-12 text-center text-rose-400 text-sm">Error cargando pedidos: ${err.message}</div>`;
            }
        }

        function obtenerBadgeEstado(estado) {
            switch (estado) {
                case 'PENDIENTE':
                    return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-950/80 text-amber-300 border border-amber-500/30">Pendiente</span>`;
                case 'EN_PROCESO':
                    return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-950/80 text-blue-300 border border-blue-500/30">En Proceso</span>`;
                case 'ENVIADO':
                    return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-purple-950/80 text-purple-300 border border-purple-500/30">Enviado</span>`;
                case 'ENTREGADO':
                    return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-950/80 text-emerald-300 border border-emerald-500/30">Entregado</span>`;
                case 'CANCELADO':
                    return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-950/80 text-rose-300 border border-rose-500/30">Cancelado</span>`;
                default:
                    return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-300">${estado}</span>`;
            }
        }

        function abrirDetalleModal(pedido) {
            modalTitle.textContent = `Detalle del Pedido #${pedido.id}`;
            modalDate.textContent = `Registrado el ${new Date(pedido.fecha).toLocaleString()}`;

            let itemsHTML = '';
            if (pedido.detalles && pedido.detalles.length > 0) {
                pedido.detalles.forEach(d => {
                    const precioU = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }).format(d.precioUnitario);
                    const sub = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }).format(d.subtotal);
                    itemsHTML += `
                        <div class="flex justify-between items-center p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                            <div>
                                <span class="font-bold text-white block">${d.productoNombre}</span>
                                <span class="text-xs text-slate-400">${d.cantidad} x ${precioU}</span>
                            </div>
                            <span class="font-extrabold text-slate-200">${sub}</span>
                        </div>
                    `;
                });
            } else {
                itemsHTML = `<p class="text-xs text-slate-400">Sin detalles registrados.</p>`;
            }

            const total = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }).format(pedido.total);

            modalContent.innerHTML = `
                <div class="space-y-3">
                    <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Productos incluidos</h4>
                    ${itemsHTML}
                </div>

                <div class="border-t border-slate-800 pt-4 mt-6 space-y-2">
                    <div class="flex justify-between text-slate-400 text-xs">
                        <span>Dirección:</span>
                        <span class="text-slate-200">${pedido.direccionEnvio || 'No especificada'}</span>
                    </div>
                    <div class="flex justify-between text-slate-400 text-xs">
                        <span>Teléfono:</span>
                        <span class="text-slate-200">${pedido.telefono || 'No especificado'}</span>
                    </div>
                    <div class="flex justify-between text-slate-400 text-xs">
                        <span>Estado:</span>
                        <span>${pedido.estado}</span>
                    </div>
                    <div class="flex justify-between items-baseline pt-3 border-t border-slate-800 text-base">
                        <span class="font-bold text-white">Monto Total:</span>
                        <span class="text-xl font-black text-indigo-400">${total}</span>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
        }
    </script>
</body>
</html>
