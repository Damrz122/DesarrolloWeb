<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — NovaStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/output.css">
    <!-- SockJS & StompJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

    <header id="main-navbar"></header>

    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 w-full">
        <div class="glass-panel w-full max-w-md p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6">
            
            <div class="text-center">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center mx-auto mb-3 shadow-lg shadow-indigo-500/25">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 class="text-2xl font-black text-white tracking-tight">Bienvenido a NovaStore</h1>
                <p class="text-xs text-slate-400 mt-1">Ingresa tus credenciales para acceder a tu cuenta</p>
            </div>

            <div class="p-3 bg-slate-900/90 rounded-2xl border border-slate-800 space-y-2">
                <div class="flex items-center justify-center space-x-1.5 text-slate-400">
                    <svg class="w-3.5 h-3.5 text-amber-400" fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                    <span class="text-[11px] font-semibold uppercase tracking-wider">Cuentas de demostración</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="demo-client-btn" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 border border-slate-700 transition-colors flex items-center justify-center space-x-1.5">
                        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        <span>Cliente Demo</span>
                    </button>
                    <button type="button" id="demo-admin-btn" class="p-2 rounded-xl bg-indigo-950/60 hover:bg-indigo-900/60 text-xs font-semibold text-indigo-300 border border-indigo-700/50 transition-colors flex items-center justify-center space-x-1.5">
                        <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                        <span>Administrador</span>
                    </button>
                </div>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Correo Electrónico</label>
                    <input id="login-email" type="email" placeholder="ejemplo@correo.com" required
                           class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors" />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Contraseña</label>
                    <input id="login-password" type="password" placeholder="••••••••" required
                           class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors" />
                </div>

                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center text-slate-400">
                        <input id="login-remember" type="checkbox" checked class="rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-0 mr-2">
                        Recordar sesión
                    </label>
                </div>

                <button type="submit" id="btn-submit-login" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 transition-all transform hover:-translate-y-0.5">
                    <span>Iniciar Sesión</span>
                </button>
            </form>

            <div class="text-center text-xs text-slate-400 pt-2 border-t border-slate-800">
                ¿Aún no tienes cuenta? 
                <a href="/registro.html" class="text-indigo-400 font-semibold hover:underline">Regístrate gratis</a>
            </div>

        </div>
    </main>

    <footer class="border-t border-slate-800/80 bg-slate-950 py-6 text-center text-xs text-slate-500">
        <p>© 2026 NovaStore.</p>
    </footer>

    <script type="module">
        import { auth } from '/assets/js/auth.js';
        import { renderNavbar } from '/assets/js/ui/navbar.js';
        import { showToast } from '/assets/js/ui/toast.js';

        renderNavbar();

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('login-email');
        const passInput = document.getElementById('login-password');
        const rememberInput = document.getElementById('login-remember');
        const submitBtn = document.getElementById('btn-submit-login');

        const demoClientBtn = document.getElementById('demo-client-btn');
        const demoAdminBtn = document.getElementById('demo-admin-btn');

        demoClientBtn.addEventListener('click', () => {
            emailInput.value = 'cliente@tienda.com';
            passInput.value = 'cliente123';
        });

        demoAdminBtn.addEventListener('click', () => {
            emailInput.value = 'admin@tienda.com';
            passInput.value = 'admin123';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                <span>Ingresando...</span>
            `;

            try {
                const email = emailInput.value.trim();
                const pass = passInput.value;
                const persistir = rememberInput.checked;

                const usuario = await auth.login(email, pass, persistir);

                const params = new URLSearchParams(window.location.search);
                const redirect = params.get('redirect');

                setTimeout(() => {
                    if (redirect) {
                        window.location.href = redirect;
                    } else if (usuario.rol === 'ADMIN') {
                        window.location.href = '/admin/dashboard.html';
                    } else {
                        window.location.href = '/index.html';
                    }
                }, 700);

            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Iniciar Sesión</span>`;
            }
        });
    </script>
</body>
</html>
