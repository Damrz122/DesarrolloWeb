<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — ELECTRONIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/output.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body class="bg-[#eaebed] text-neutral-800 min-h-screen flex flex-col antialiased">

    <header id="main-navbar" class="elx-header">
        <div class="elx-topbar">
            <div class="elx-container elx-topbar-inner">
                <span class="elx-brand-tag">ELECTRONIX</span>
                <span class="elx-topbar-promo">ENVIO GRATIS POR COMPRA MAYOR A S/ 199</span>
                <div class="elx-topbar-actions">
                    <div class="elx-country-badge">
                        <span class="elx-per-flag"><span class="red"></span><span class="white"></span><span class="red"></span></span>
                        <span>PER</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="elx-mainbar">
            <div class="elx-container elx-mainbar-inner">
                <a href="/index.html" class="elx-logo-link" title="ELECTRONIX">
                    <svg class="elx-logo-svg" viewBox="0 0 100 90" fill="currentColor">
                        <path d="M15 12h65c4 0 7 3 7 7s-3 7-7 7H38l-4 12h32c3 0 6 3 5 7l-4 10c-1 3-3 5-6 5H24l-6 18c-1 3-4 5-8 5s-6-3-5-7L15 12z" />
                        <polygon points="68,28 48,50 62,50 42,75 50,56 36,56" fill="#1ca299" />
                        <circle cx="42" cy="82" r="6" fill="#1ca299" />
                        <circle cx="68" cy="82" r="6" fill="#1ca299" />
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 w-full my-8">
        <div class="bg-white w-full max-w-md p-6 sm:p-8 rounded-2xl border border-neutral-200 shadow-xl space-y-6">
            
            <div class="text-center">
                <div class="w-12 h-12 rounded-xl bg-[#0b2e2b] text-[#1ca299] flex items-center justify-center mx-auto mb-3 shadow-md">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 class="text-2xl font-black text-neutral-900 tracking-tight uppercase">Bienvenido a Electronix</h1>
                <p class="text-xs text-neutral-500 mt-1">Ingresa tus credenciales para acceder a tu cuenta</p>
            </div>

            <!-- Accesos rápidos de Demostración -->
            <div class="p-3.5 bg-neutral-50 rounded-xl border border-neutral-200 space-y-2">
                <div class="flex items-center justify-center space-x-1.5 text-neutral-500">
                    <svg class="w-3.5 h-3.5 text-amber-500" fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                    <span class="text-[11px] font-bold uppercase tracking-wider">Cuentas de demostración</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="demo-client-btn" class="p-2 rounded-xl bg-white hover:bg-neutral-100 text-xs font-bold text-neutral-700 border border-neutral-300 transition-colors flex items-center justify-center space-x-1.5 shadow-sm">
                        <svg class="w-3.5 h-3.5 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        <span>Cliente Demo</span>
                    </button>
                    <button type="button" id="demo-admin-btn" class="p-2 rounded-xl bg-[#0b2e2b] hover:bg-[#14635c] text-xs font-bold text-[#1ca299] border border-[#14635c] transition-colors flex items-center justify-center space-x-1.5 shadow-sm">
                        <svg class="w-3.5 h-3.5 text-[#1ca299]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                        <span>Administrador</span>
                    </button>
                </div>
            </div>

            <!-- Formulario de Login -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-neutral-700 mb-1.5">Correo Electrónico</label>
                    <input id="login-email" type="email" placeholder="ejemplo@correo.com" required
                           class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-4 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#14635c] transition-colors" />
                </div>

                <div>
                    <label class="block text-xs font-bold text-neutral-700 mb-1.5">Contraseña</label>
                    <input id="login-password" type="password" placeholder="••••••••" required
                           class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-4 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#14635c] transition-colors" />
                </div>

                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center text-neutral-600 font-medium">
                        <input id="login-remember" type="checkbox" checked class="rounded border-neutral-300 text-[#14635c] focus:ring-0 mr-2">
                        Recordar sesión
                    </label>
                </div>

                <button type="submit" id="btn-submit-login" class="w-full bg-[#14635c] hover:bg-[#1ca299] text-white font-bold py-3 px-6 rounded-xl shadow-md transition-all flex items-center justify-center space-x-2">
                    <span>Iniciar Sesión</span>
                </button>
            </form>

            <div class="text-center text-xs text-neutral-500 pt-2 border-t border-neutral-100">
                ¿Aún no tienes cuenta? 
                <a href="/registro.html" class="text-[#14635c] font-bold hover:underline">Regístrate gratis</a>
            </div>

        </div>
    </main>

    <footer class="border-t border-neutral-200 bg-white py-6 text-center text-xs text-neutral-500 mt-auto">
        <p>© 2026 ELECTRONIX. Todos los derechos reservados.</p>
    </footer>

    <script type="module">
        import { auth } from '/assets/js/auth.js';
        import { renderNavbar } from '/assets/js/ui/navbar.js';

        renderNavbar();

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('login-email');
        const passInput = document.getElementById('login-password');
        const rememberInput = document.getElementById('login-remember');
        const submitBtn = document.getElementById('btn-submit-login');

        const demoClientBtn = document.getElementById('demo-client-btn');
        const demoAdminBtn = document.getElementById('demo-admin-btn');

        demoClientBtn.addEventListener('click', () => {
            emailInput.value = 'cliente@tienda.com';
            passInput.value = 'cliente123';
        });

        demoAdminBtn.addEventListener('click', () => {
            emailInput.value = 'admin@tienda.com';
            passInput.value = 'admin123';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                <span>Ingresando...</span>
            `;

            try {
                const email = emailInput.value.trim();
                const pass = passInput.value;
                const persistir = rememberInput.checked;

                const usuario = await auth.login(email, pass, persistir);

                const params = new URLSearchParams(window.location.search);
                const redirect = params.get('redirect');

                setTimeout(() => {
                    if (redirect) {
                        window.location.href = redirect;
                    } else if (usuario.rol === 'ADMIN') {
                        window.location.href = '/admin/dashboard.html';
                    } else {
                        window.location.href = '/index.html';
                    }
                }, 700);

            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Iniciar Sesión</span>`;
            }
        });
    </script>
</body>
</html>
