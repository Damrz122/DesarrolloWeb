<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito de Compras — ELECTRONIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/output.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body class="bg-[#eaebed] text-neutral-800 min-h-screen flex flex-col antialiased">

    <header id="main-navbar" class="w-full sticky top-0 z-50 shadow-md">
        <div class="bg-[#0b2e2b] text-white px-4 sm:px-8 py-1.5 border-b border-[#0f3d39]">
            <div class="max-w-7xl mx-auto flex items-center justify-between text-xs font-bold tracking-wider">
                <span class="text-white text-xs sm:text-sm font-black tracking-widest uppercase">ELECTRONIX</span>
                <span class="text-white text-[11px] sm:text-xs font-bold uppercase tracking-wide text-center">ENVIO GRATIS POR COMPRA MAYOR A S/ 199</span>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-1.5 bg-[#07201e] px-2 py-0.5 rounded border border-[#14534e]">
                        <span class="inline-flex w-4 h-3 rounded-sm overflow-hidden flex-row border border-white/20">
                            <span class="w-1/3 bg-red-600"></span><span class="w-1/3 bg-white"></span><span class="w-1/3 bg-red-600"></span>
                        </span>
                        <span class="text-[11px] text-white font-bold">PER</span>
                    </div>
                    <a href="/carrito.html" class="relative text-white hover:text-[#1ca299] transition-colors flex items-center" title="Ver carrito">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        <span id="cart-badge-top" class="hidden ml-1 px-1.5 py-0.2 bg-[#1ca299] text-slate-950 font-extrabold text-[10px] rounded-full">0</span>
                    </a>
                </div>
            </div>
        </div>
        <div class="bg-[#1e1e1e] px-4 sm:px-8 py-3 border-b border-neutral-800">
            <div class="max-w-7xl mx-auto flex items-center justify-between gap-4 sm:gap-8">
                <a href="/index.html" class="flex items-center space-x-2 flex-shrink-0 group" title="ELECTRONIX">
                    <svg class="w-11 h-10 text-slate-200" viewBox="0 0 100 90" fill="currentColor">
                        <path d="M15 12h65c4 0 7 3 7 7s-3 7-7 7H38l-4 12h32c3 0 6 3 5 7l-4 10c-1 3-3 5-6 5H24l-6 18c-1 3-4 5-8 5s-6-3-5-7L15 12z" />
                        <polygon points="68,28 48,50 62,50 42,75 50,56 36,56" fill="#1ca299" />
                        <circle cx="42" cy="82" r="6" fill="#1ca299" />
                        <circle cx="68" cy="82" r="6" fill="#1ca299" />
                    </svg>
                </a>
                <form id="nav-search-form" class="flex-1 max-w-3xl relative" action="/index.html" method="GET">
                    <input id="nav-search-input" type="text" name="q" placeholder="Buscar en Electronix" class="w-full bg-[#4a4a4a] text-white placeholder-neutral-300 text-sm rounded-lg pl-10 pr-4 py-2.5 border border-neutral-600 focus:border-[#1ca299] focus:outline-none transition-all shadow-inner" />
                    <div class="absolute left-3.5 top-3 text-neutral-300 pointer-events-none">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                </form>
                <div id="nav-auth-container" class="flex items-center space-x-3 flex-shrink-0">
                    <a href="/login.html" id="nav-login-btn" class="flex flex-col items-center justify-center text-white hover:text-[#1ca299] transition-colors group">
                        <svg class="w-6 h-6 text-white group-hover:text-[#1ca299]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <span class="text-[10px] font-black tracking-tighter uppercase mt-0.5">INICIAR SESIÓN</span>
                    </a>
                </div>
            </div>
        </div>
        <div class="bg-[#333333] text-white px-4 sm:px-8 py-2 border-b border-neutral-700 text-xs font-bold uppercase tracking-wider">
            <div class="max-w-7xl mx-auto flex items-center space-x-8 overflow-x-auto">
                <a href="/index.html" class="flex items-center space-x-1.5 hover:text-[#1ca299] transition-colors flex-shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    <span>TODO</span>
                </a>
                <div class="relative group flex-shrink-0">
                    <button class="flex items-center space-x-1 hover:text-[#1ca299] transition-colors py-1">
                        <span>CATEGORIAS</span>
                        <svg class="w-3.5 h-3.5 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="nav-categories-dropdown" class="hidden group-hover:block absolute left-0 mt-1 w-56 bg-[#222222] border border-neutral-700 rounded-xl shadow-2xl py-2 z-50 text-xs normal-case">
                        <a href="/index.html" class="block px-4 py-2 hover:bg-neutral-800 text-neutral-300 hover:text-white">Todas las categorías</a>
                    </div>
                </div>
                <a href="/index.html?ofertas=true" class="hover:text-[#1ca299] transition-colors flex-shrink-0">OFERTAS</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-8 py-8 flex-1 w-full">
        <div class="mb-6">
            <h1 class="text-2xl sm:text-3xl font-black text-neutral-900 uppercase">Carrito de Compras</h1>
            <p class="text-xs text-neutral-500 mt-1">Revisa los productos seleccionados antes de confirmar tu pedido</p>
        </div>

        <div id="cart-content-container" class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            <div class="col-span-full py-20 text-center text-neutral-400">
                <div class="w-10 h-10 border-4 border-[#14635c]/30 border-t-[#14635c] rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-sm">Cargando tu carrito...</p>
            </div>
        </div>
    </main>

    <footer class="border-t border-neutral-200 bg-white py-6 text-center text-xs text-neutral-500 mt-auto">
        <p>© 2026 ELECTRONIX. Todos los derechos reservados.</p>
    </footer>

    <script type="module">
        import { auth } from '/assets/js/auth.js';
        import { cart } from '/assets/js/cart.js';
        import { renderNavbar } from '/assets/js/ui/navbar.js';

        renderNavbar();

        const container = document.getElementById('cart-content-container');

        async function cargarVistaCarrito() {
            if (!auth.isAuthenticated()) {
                container.innerHTML = `
                    <div class="col-span-full bg-white rounded-2xl p-12 text-center max-w-xl mx-auto border border-neutral-200 shadow-md">
                        <div class="w-16 h-16 rounded-2xl bg-[#0b2e2b] text-[#1ca299] flex items-center justify-center mx-auto mb-4">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </div>
                        <h2 class="text-xl font-bold text-neutral-900 mb-2">Inicia sesión para ver tu carrito</h2>
                        <p class="text-xs text-neutral-500 mb-6">Guarda tus productos favoritos y sincroniza tu pedido desde cualquier dispositivo.</p>
                        <a href="/login.html?redirect=/carrito.html" class="inline-flex items-center px-6 py-3 rounded-xl bg-[#14635c] hover:bg-[#1ca299] text-white font-bold text-xs uppercase tracking-wider transition-all shadow-md">
                            Iniciar Sesión
                        </a>
                    </div>
                `;
                return;
            }

            try {
                const datos = await cart.obtenerCarrito();

                if (!datos || !datos.items || datos.items.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full bg-white rounded-2xl p-12 text-center max-w-xl mx-auto border border-neutral-200 shadow-md">
                            <div class="w-16 h-16 rounded-2xl bg-neutral-100 text-neutral-400 flex items-center justify-center mx-auto mb-4">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            </div>
                            <h2 class="text-xl font-bold text-neutral-900 mb-2">Tu carrito está vacío</h2>
                            <p class="text-xs text-neutral-500 mb-6">Aún no has agregado ningún producto a tu orden.</p>
                            <a href="/index.html" class="inline-flex items-center px-6 py-3 rounded-xl bg-[#14635c] hover:bg-[#1ca299] text-white font-bold text-xs uppercase tracking-wider transition-all shadow-md">
                                Explorar Catálogo
                            </a>
                        </div>
                    `;
                    return;
                }

                const totalFormateado = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }).format(datos.total);

                let itemsHTML = '';
                datos.items.forEach(item => {
                    const precioUnit = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }).format(item.precioUnitario);
                    const subtotal = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }).format(item.subtotal);
                    const fallbackImg = 'https://images.unsplash.com/photo-1526738549149-8e07eca6c147?w=600&auto=format&fit=crop&q=80';

                    itemsHTML += `
                        <div class="flex flex-col sm:flex-row items-center justify-between p-4 sm:p-5 bg-white rounded-2xl border border-neutral-200 gap-4 shadow-sm" id="cart-row-${item.id}">
                            <div class="flex items-center space-x-4 w-full sm:w-auto">
                                <img src="${item.imagenUrl || fallbackImg}" alt="${item.productoNombre}" class="w-18 h-18 sm:w-20 sm:h-20 rounded-xl object-contain bg-neutral-50 border border-neutral-200 p-1 flex-shrink-0" onerror="this.src='${fallbackImg}'">
                                <div>
                                    <a href="/producto.html?id=${item.productoId}" class="font-bold text-neutral-900 hover:text-[#14635c] text-sm sm:text-base line-clamp-1">
                                        ${item.productoNombre}
                                    </a>
                                    <span class="text-xs text-neutral-500 block mt-1">Precio unitario: ${precioUnit}</span>
                                </div>
                            </div>

                            <div class="flex items-center justify-between w-full sm:w-auto sm:space-x-6">
                                <div class="flex items-center border border-neutral-300 bg-neutral-50 rounded-xl p-1">
                                    <button class="btn-item-minus w-8 h-8 rounded-lg bg-white hover:bg-neutral-200 text-neutral-800 font-bold flex items-center justify-center transition-colors shadow-sm" data-id="${item.id}" data-cant="${item.cantidad}">
                                        -
                                    </button>
                                    <span class="w-10 text-center text-sm font-bold text-neutral-900">${item.cantidad}</span>
                                    <button class="btn-item-plus w-8 h-8 rounded-lg bg-white hover:bg-neutral-200 text-neutral-800 font-bold flex items-center justify-center transition-colors shadow-sm" data-id="${item.id}" data-cant="${item.cantidad}">
                                        +
                                    </button>
                                </div>

                                <div class="text-right min-w-[90px]">
                                    <span class="text-[10px] text-neutral-400 font-bold block uppercase">Subtotal</span>
                                    <span class="text-base font-black text-neutral-900">${subtotal}</span>
                                </div>

                                <button class="btn-item-remove p-2 text-rose-600 hover:text-rose-700 hover:bg-rose-50 rounded-xl transition-colors" data-id="${item.id}" title="Eliminar del carrito">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = `
                    <div class="lg:col-span-2 space-y-4">
                        ${itemsHTML}
                        <div class="flex justify-between items-center pt-2">
                            <a href="/index.html" class="inline-flex items-center space-x-1.5 text-xs font-bold text-[#14635c] hover:underline">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                                <span>Continuar comprando</span>
                            </a>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl border border-neutral-200 shadow-md space-y-6">
                        <h2 class="text-base font-black text-neutral-900 border-b border-neutral-100 pb-3 uppercase">Resumen de la Orden</h2>

                        <div class="space-y-3 text-sm">
                            <div class="flex justify-between text-neutral-600 text-xs">
                                <span>Ítems totales</span>
                                <span class="font-bold text-neutral-900">${datos.cantidadTotal} unidades</span>
                            </div>
                            <div class="flex justify-between text-neutral-600 text-xs">
                                <span>Costo de envío</span>
                                <span class="font-bold text-emerald-600">Gratis</span>
                            </div>
                            <div class="border-t border-neutral-200 pt-3 flex justify-between items-baseline">
                                <span class="text-sm font-bold text-neutral-800 uppercase">Total a pagar</span>
                                <span class="text-2xl font-black text-neutral-900">${totalFormateado}</span>
                            </div>
                        </div>

                        <a href="/checkout.html" class="w-full bg-[#14635c] hover:bg-[#1ca299] text-white font-bold py-3.5 px-6 rounded-xl shadow-md flex items-center justify-center space-x-2 transition-all">
                            <span>Proceder al Checkout</span>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>

                        <div class="p-3 bg-neutral-50 rounded-xl border border-neutral-200 text-[11px] text-neutral-500 flex items-center justify-center space-x-1.5 text-center">
                            <svg class="w-3.5 h-3.5 text-neutral-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                            <span>Compra segura garantizada en Electronix.</span>
                        </div>
                    </div>
                `;

                container.querySelectorAll('.btn-item-minus').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.dataset.id;
                        const cant = parseInt(btn.dataset.cant);
                        if (cant > 1) {
                            await cart.actualizarCantidad(id, cant - 1);
                            cargarVistaCarrito();
                        } else {
                            await cart.removerItem(id);
                            cargarVistaCarrito();
                        }
                    });
                });

                container.querySelectorAll('.btn-item-plus').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.dataset.id;
                        const cant = parseInt(btn.dataset.cant);
                        await cart.actualizarCantidad(id, cant + 1);
                        cargarVistaCarrito();
                    });
                });

                container.querySelectorAll('.btn-item-remove').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.dataset.id;
                        await cart.removerItem(id);
                        cargarVistaCarrito();
                    });
                });

            } catch (err) {
                container.innerHTML = `<div class="col-span-full py-12 text-center text-rose-600 font-bold">Error al cargar carrito: ${err.message}</div>`;
            }
        }

        cargarVistaCarrito();
    </script>
</body>
</html>
