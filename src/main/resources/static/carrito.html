<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito de Compras — NovaStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/output.css">
    <!-- SockJS & StompJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

    <header id="main-navbar"></header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full">
        <div class="mb-8">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Carrito de Compras</h1>
            <p class="text-sm text-slate-400 mt-1">Revisa los productos que has seleccionado antes de finalizar tu orden</p>
        </div>

        <div id="cart-content-container" class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            <!-- Esqueleto -->
            <div class="col-span-full py-20 text-center text-slate-500">
                <div class="w-10 h-10 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-sm">Cargando tu carrito...</p>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800/80 bg-slate-950 py-8 mt-16 text-center text-xs text-slate-500">
        <p>© 2026 NovaStore. Compra protegida y segura.</p>
    </footer>

    <script type="module">
        import { auth } from '/assets/js/auth.js';
        import { cart } from '/assets/js/cart.js';
        import { renderNavbar } from '/assets/js/ui/navbar.js';
        import { showToast } from '/assets/js/ui/toast.js';

        renderNavbar();

        const container = document.getElementById('cart-content-container');

        async function cargarVistaCarrito() {
            if (!auth.isAuthenticated()) {
                container.innerHTML = `
                    <div class="col-span-full glass-panel rounded-3xl p-12 text-center max-w-xl mx-auto border border-slate-800">
                        <div class="w-16 h-16 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center mx-auto mb-4">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </div>
                        <h2 class="text-xl font-bold text-white mb-2">Inicia sesión para ver tu carrito</h2>
                        <p class="text-sm text-slate-400 mb-6">Guarda tus productos favoritos y sincroniza tu pedido desde cualquier dispositivo.</p>
                        <a href="/login.html?redirect=/carrito.html" class="inline-flex items-center px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition-all shadow-lg shadow-indigo-600/30">
                            Iniciar Sesión
                        </a>
                    </div>
                `;
                return;
            }

            try {
                const datos = await cart.obtenerCarrito();

                if (!datos || !datos.items || datos.items.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full glass-panel rounded-3xl p-12 text-center max-w-xl mx-auto border border-slate-800">
                            <div class="w-16 h-16 rounded-2xl bg-slate-800/80 text-slate-400 flex items-center justify-center mx-auto mb-4">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            </div>
                            <h2 class="text-xl font-bold text-white mb-2">Tu carrito está vacío</h2>
                            <p class="text-sm text-slate-400 mb-6">Aún no has agregado ningún producto tecnológico a tu orden.</p>
                            <a href="/index.html" class="inline-flex items-center px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition-all shadow-lg shadow-indigo-600/30">
                                Explorar Catálogo
                            </a>
                        </div>
                    `;
                    return;
                }

                const totalFormateado = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }).format(datos.total);

                let itemsHTML = '';
                datos.items.forEach(item => {
                    const precioUnit = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }).format(item.precioUnitario);
                    const subtotal = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }).format(item.subtotal);
                    const fallbackImg = 'https://images.unsplash.com/photo-1526738549149-8e07eca6c147?w=600&auto=format&fit=crop&q=80';

                    itemsHTML += `
                        <div class="flex flex-col sm:flex-row items-center justify-between p-4 sm:p-5 bg-slate-900/60 rounded-2xl border border-slate-800/80 gap-4" id="cart-row-${item.id}">
                            <div class="flex items-center space-x-4 w-full sm:w-auto">
                                <img src="${item.imagenUrl || fallbackImg}" alt="${item.productoNombre}" class="w-20 h-20 rounded-xl object-cover bg-slate-950 border border-slate-800 flex-shrink-0" onerror="this.src='${fallbackImg}'">
                                <div>
                                    <a href="/producto.html?id=${item.productoId}" class="font-bold text-white hover:text-indigo-400 text-sm sm:text-base line-clamp-1">
                                        ${item.productoNombre}
                                    </a>
                                    <span class="text-xs text-slate-400 block mt-1">Precio unitario: ${precioUnit}</span>
                                </div>
                            </div>

                            <div class="flex items-center justify-between w-full sm:w-auto sm:space-x-6">
                                <!-- Botones Cantidad -->
                                <div class="flex items-center border border-slate-700 bg-slate-950 rounded-xl p-1">
                                    <button class="btn-item-minus w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold flex items-center justify-center transition-colors" data-id="${item.id}" data-cant="${item.cantidad}">
                                        -
                                    </button>
                                    <span class="w-10 text-center text-sm font-bold text-white">${item.cantidad}</span>
                                    <button class="btn-item-plus w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold flex items-center justify-center transition-colors" data-id="${item.id}" data-cant="${item.cantidad}">
                                        +
                                    </button>
                                </div>

                                <!-- Subtotal -->
                                <div class="text-right min-w-[90px]">
                                    <span class="text-xs text-slate-500 block">Subtotal</span>
                                    <span class="text-base font-extrabold text-white">${subtotal}</span>
                                </div>

                                <!-- Eliminar -->
                                <button class="btn-item-remove p-2 text-rose-400 hover:text-rose-300 hover:bg-rose-950/30 rounded-xl transition-colors" data-id="${item.id}" title="Eliminar del carrito">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = `
                    <!-- Columna de Ítems -->
                    <div class="lg:col-span-2 space-y-4">
                        ${itemsHTML}
                        <div class="flex justify-between items-center pt-2">
                            <a href="/index.html" class="inline-flex items-center text-xs font-semibold text-indigo-400 hover:text-indigo-300">
                                ← Continuar comprando
                            </a>
                        </div>
                    </div>

                    <!-- Resumen del Pedido -->
                    <div class="glass-panel p-6 rounded-3xl border border-slate-800 shadow-xl space-y-6">
                        <h2 class="text-lg font-bold text-white border-b border-slate-800 pb-3">Resumen de la Orden</h2>

                        <div class="space-y-3 text-sm">
                            <div class="flex justify-between text-slate-400">
                                <span>Ítems totales</span>
                                <span class="font-medium text-white">${datos.cantidadTotal} unidades</span>
                            </div>
                            <div class="flex justify-between text-slate-400">
                                <span>Costo de envío</span>
                                <span class="font-medium text-emerald-400">¡Gratis!</span>
                            </div>
                            <div class="border-t border-slate-800/80 pt-3 flex justify-between items-baseline">
                                <span class="text-base font-bold text-white">Total a pagar</span>
                                <span class="text-2xl font-black text-indigo-400">${totalFormateado}</span>
                            </div>
                        </div>

                        <a href="/checkout.html" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 transition-all transform hover:-translate-y-0.5">
                            <span>Proceder al Checkout</span>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>

                        <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800 text-[11px] text-slate-400 text-center">
                            🔒 Pago simulado para fines de evaluación académica. Sin cobro con tarjeta real.
                        </div>
                    </div>
                `;

                // Conectar eventos de botones de cantidad y remover
                container.querySelectorAll('.btn-item-minus').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.dataset.id;
                        const cant = parseInt(btn.dataset.cant);
                        if (cant > 1) {
                            await cart.actualizarCantidad(id, cant - 1);
                            cargarVistaCarrito();
                        } else {
                            await cart.removerItem(id);
                            cargarVistaCarrito();
                        }
                    });
                });

                container.querySelectorAll('.btn-item-plus').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.dataset.id;
                        const cant = parseInt(btn.dataset.cant);
                        await cart.actualizarCantidad(id, cant + 1);
                        cargarVistaCarrito();
                    });
                });

                container.querySelectorAll('.btn-item-remove').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.dataset.id;
                        await cart.removerItem(id);
                        cargarVistaCarrito();
                    });
                });

            } catch (err) {
                container.innerHTML = `<div class="col-span-full py-12 text-center text-rose-400">Error al cargar carrito: ${err.message}</div>`;
            }
        }

        cargarVistaCarrito();
    </script>
</body>
</html>
