<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos — ELECTRONIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/output.css">
    <!-- SockJS & StompJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

    <header id="main-navbar"></header>

    <div class="bg-slate-900/60 border-b border-slate-800 backdrop-blur-md sticky top-16 sm:top-20 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between overflow-x-auto py-3 space-x-6 text-sm">
            <div class="flex items-center space-x-2">
                <span class="px-2.5 py-1 rounded-lg bg-indigo-500/20 text-indigo-400 font-bold text-xs">ADMIN</span>
                <span class="font-bold text-white">Gestión de Catálogo</span>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/admin/dashboard.html" class="text-slate-400 hover:text-white transition-colors pb-1">Dashboard</a>
                <a href="/admin/productos.html" class="text-indigo-400 font-semibold border-b-2 border-indigo-500 pb-1">Productos</a>
                <a href="/admin/categorias.html" class="text-slate-400 hover:text-white transition-colors pb-1">Categorías</a>
                <a href="/admin/pedidos.html" class="text-slate-400 hover:text-white transition-colors pb-1">Pedidos</a>
                <a href="/admin/reportes.html" class="text-slate-400 hover:text-white transition-colors pb-1">Reportes</a>
                <a href="/admin/chat.html" class="text-slate-400 hover:text-white transition-colors pb-1">Chat Clientes</a>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-6">
        
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Inventario de Productos</h1>
                <p class="text-sm text-slate-400 mt-1">Crea, edita y gestiona el stock de tus productos</p>
            </div>
            <button id="btn-nuevo-producto" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-5 rounded-xl shadow-lg shadow-indigo-600/25 flex items-center space-x-2 text-sm transition-all">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span>Nuevo Producto</span>
            </button>
        </div>

        <div class="glass-panel rounded-3xl border border-slate-800 shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-900 text-slate-400 uppercase tracking-wider font-semibold border-b border-slate-800">
                        <tr>
                            <th class="p-4">Producto</th>
                            <th class="p-4">Categoría</th>
                            <th class="p-4">Precio</th>
                            <th class="p-4">Stock</th>
                            <th class="p-4">Estado</th>
                            <th class="p-4 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="productos-table-body" class="divide-y divide-slate-800/60">
                        <tr>
                            <td colspan="6" class="p-8 text-center text-slate-500">Cargando inventario...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Modal Crear / Editar Producto -->
    <div id="producto-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="glass-panel w-full max-w-lg rounded-3xl border border-slate-800 shadow-2xl p-6 sm:p-8 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
                <h3 id="modal-title" class="text-lg font-bold text-white">Nuevo Producto</h3>
                <button id="modal-close" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <form id="producto-form" class="space-y-4 text-sm">
                <input type="hidden" id="prod-id" />

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Nombre del Producto *</label>
                    <input id="prod-nombre" type="text" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-indigo-500" />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Categoría *</label>
                    <select id="prod-categoria" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                        <option value="">Selecciona una categoría</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Precio (S/) *</label>
                        <input id="prod-precio" type="number" step="0.01" min="0.1" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-indigo-500" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Stock Disponible *</label>
                        <input id="prod-stock" type="number" min="0" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-indigo-500" />
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">URL de Imagen</label>
                    <input id="prod-imagen" type="url" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-indigo-500" />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Descripción</label>
                    <textarea id="prod-descripcion" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <div class="pt-4 border-t border-slate-800 flex justify-end space-x-3">
                    <button type="button" id="btn-cancelar-modal" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition-colors">
                        Cancelar
                    </button>
                    <button type="submit" id="btn-guardar-prod" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-md shadow-indigo-600/30 transition-all">
                        Guardar Producto
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { api } from '/assets/js/api.js';
        import { auth } from '/assets/js/auth.js';
        import { renderNavbar } from '/assets/js/ui/navbar.js';
        import { showToast } from '/assets/js/ui/toast.js';

        renderNavbar();

        if (!auth.protegerRutaAdmin()) {
            // Guard
        } else {
            initProductosAdmin();
        }

        const tbody = document.getElementById('productos-table-body');
        const modal = document.getElementById('producto-modal');
        const modalClose = document.getElementById('modal-close');
        const btnCancelar = document.getElementById('btn-cancelar-modal');
        const btnNuevo = document.getElementById('btn-nuevo-producto');
        const form = document.getElementById('producto-form');
        const selectCat = document.getElementById('prod-categoria');
        const modalTitle = document.getElementById('modal-title');

        let listaCategorias = [];

        async function initProductosAdmin() {
            await cargarCategoriasSelect();
            await cargarTablaProductos();

            btnNuevo.addEventListener('click', () => {
                abrirModalCrear();
            });

            modalClose.addEventListener('click', () => modal.classList.add('hidden'));
            btnCancelar.addEventListener('click', () => modal.classList.add('hidden'));

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                await guardarProducto();
            });
        }

        async function cargarCategoriasSelect() {
            try {
                const res = await api.get('/api/categorias');
                if (res.exito && res.datos) {
                    listaCategorias = res.datos;
                    selectCat.innerHTML = '<option value="">Selecciona una categoría</option>';
                    listaCategorias.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c.id;
                        opt.textContent = c.nombre;
                        selectCat.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function cargarTablaProductos() {
            try {
                const res = await api.get('/api/productos/admin?size=50');
                tbody.innerHTML = '';

                if (res.exito && res.datos && res.datos.contenido.length > 0) {
                    res.datos.contenido.forEach(p => {
                        const precio = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }).format(p.precio);
                        const fallback = 'https://images.unsplash.com/photo-1526738549149-8e07eca6c147?w=600&auto=format&fit=crop&q=80';

                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-slate-900/50 transition-colors';
                        tr.innerHTML = `
                            <td class="p-4">
                                <div class="flex items-center space-x-3">
                                    <img src="${p.imagenUrl || fallback}" alt="" class="w-10 h-10 rounded-lg object-cover bg-slate-950 border border-slate-800" onerror="this.src='${fallback}'" />
                                    <div>
                                        <div class="font-bold text-white">${p.nombre}</div>
                                        <div class="text-[11px] text-slate-500">ID: #${p.id}</div>
                                    </div>
                                </div>
                            </td>
                            <td class="p-4 text-slate-300">${p.categoriaNombre || 'Sin categoría'}</td>
                            <td class="p-4 font-bold text-white">${precio}</td>
                            <td class="p-4">
                                <span class="font-semibold ${p.stock <= 5 ? 'text-rose-400' : 'text-slate-200'}">
                                    ${p.stock} uds.
                                </span>
                            </td>
                            <td class="p-4">
                                <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold ${
                                    p.activo 
                                        ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-500/30' 
                                        : 'bg-slate-800 text-slate-500 border border-slate-700'
                                }">
                                    ${p.activo ? 'Activo' : 'Inactivo'}
                                </span>
                            </td>
                            <td class="p-4 text-right space-x-2">
                                <button class="btn-editar px-3 py-1 rounded-lg bg-indigo-950/80 hover:bg-indigo-900/80 text-indigo-300 font-semibold border border-indigo-700/50 transition-colors">
                                    Editar
                                </button>
                                ${p.activo ? `
                                    <button class="btn-eliminar px-3 py-1 rounded-lg bg-rose-950/80 hover:bg-rose-900/80 text-rose-300 font-semibold border border-rose-700/50 transition-colors">
                                        Desactivar
                                    </button>
                                ` : ''}
                            </td>
                        `;

                        tr.querySelector('.btn-editar').addEventListener('click', () => abrirModalEditar(p));
                        const btnElim = tr.querySelector('.btn-eliminar');
                        if (btnElim) {
                            btnElim.addEventListener('click', () => desactivarProducto(p.id, p.nombre));
                        }

                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">No hay productos registrados.</td></tr>`;
                }
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-rose-400">Error: ${err.message}</td></tr>`;
            }
        }

        function abrirModalCrear() {
            modalTitle.textContent = 'Nuevo Producto';
            document.getElementById('prod-id').value = '';
            document.getElementById('prod-nombre').value = '';
            document.getElementById('prod-categoria').value = '';
            document.getElementById('prod-precio').value = '';
            document.getElementById('prod-stock').value = '';
            document.getElementById('prod-imagen').value = '';
            document.getElementById('prod-descripcion').value = '';
            modal.classList.remove('hidden');
        }

        function abrirModalEditar(p) {
            modalTitle.textContent = 'Editar Producto #' + p.id;
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-nombre').value = p.nombre;
            document.getElementById('prod-categoria').value = p.categoriaId;
            document.getElementById('prod-precio').value = p.precio;
            document.getElementById('prod-stock').value = p.stock;
            document.getElementById('prod-imagen').value = p.imagenUrl || '';
            document.getElementById('prod-descripcion').value = p.descripcion || '';
            modal.classList.remove('hidden');
        }

        async function guardarProducto() {
            const id = document.getElementById('prod-id').value;
            const payload = {
                nombre: document.getElementById('prod-nombre').value.trim(),
                categoriaId: parseInt(document.getElementById('prod-categoria').value),
                precio: parseFloat(document.getElementById('prod-precio').value),
                stock: parseInt(document.getElementById('prod-stock').value),
                imagenUrl: document.getElementById('prod-imagen').value.trim(),
                descripcion: document.getElementById('prod-descripcion').value.trim()
            };

            try {
                if (id) {
                    await api.put(`/api/productos/${id}`, payload);
                    showToast('Producto actualizado exitosamente', 'success');
                } else {
                    await api.post('/api/productos', payload);
                    showToast('Producto creado exitosamente', 'success');
                }
                modal.classList.add('hidden');
                cargarTablaProductos();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function desactivarProducto(id, nombre) {
            if (!confirm(`¿Estás seguro de desactivar el producto "${nombre}"? No aparecerá en el catálogo público.`)) {
                return;
            }
            try {
                await api.delete(`/api/productos/${id}`);
                showToast('Producto desactivado correctamente', 'info');
                cargarTablaProductos();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }
    </script>
</body>
</html>
