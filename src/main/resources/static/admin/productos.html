<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos — ELECTRONIX Admin</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <link rel="stylesheet" href="/assets/css/output.css">
    <script src="/assets/js/admin-theme.js"></script>
    <link rel="stylesheet" href="/assets/css/admin.css?v=2">
    <link rel="stylesheet" href="/assets/css/admin/productos.css?v=2">
    <link rel="stylesheet" href="/assets/css/ui/ui-inline.css?v=2">
</head>
<body class="adm">

    <header id="main-navbar"></header>

    <main class="adm-main">

        <div class="adm-pagehead">
            <div>
                <h1 class="adm-title">Inventario de productos</h1>
                <p class="adm-subtitle">Crea, edita y gestiona el stock de tu catálogo</p>
            </div>
            <div class="adm-actions">
                <button id="btn-nuevo-producto" class="adm-btn adm-btn-primary">
                    <span>Nuevo producto</span>
                </button>
            </div>
        </div>

        <div class="adm-card">
            <div class="adm-table-wrap">
                <table class="adm-table">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Etiqueta</th>
                            <th>Estado</th>
                            <th class="num">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="productos-table-body" class="adm-fade">
                        <tr>
                            <td colspan="7" class="adm-empty">Cargando inventario…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="productos-pager" class="adm-pager" hidden></div>
        </div>

    </main>

    <!-- modal: es para crear y editar productos -->
    <div id="producto-modal" class="adm-modal-backdrop hidden">
        <div class="adm-modal">
            <div class="adm-modal-head">
                <h3 id="modal-title" class="adm-modal-title">Nuevo producto</h3>
                <button id="modal-close" class="adm-close" aria-label="Cerrar">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <form id="producto-form">
                <input type="hidden" id="prod-id" />

                <div class="adm-campo">
                    <label class="adm-label" for="prod-nombre">Nombre del producto *</label>
                    <input id="prod-nombre" type="text" required class="adm-input" placeholder="Ej. Laptop HP Pavilion 15" />
                </div>

                <div class="adm-campo">
                    <label class="adm-label" for="prod-categoria">Categoría *</label>
                    <select id="prod-categoria" required class="adm-select">
                        <option value="">Selecciona una categoría</option>
                    </select>
                </div>

                <div class="adm-form-row adm-campo">
                    <div>
                        <label class="adm-label" for="prod-precio">Precio *</label>
                        <input id="prod-precio" type="number" step="0.01" min="0.1" required class="adm-input" placeholder="Ej. 2499.99" />
                    </div>
                    <div>
                        <label class="adm-label" for="prod-moneda">Moneda *</label>
                        <select id="prod-moneda" class="adm-select"></select>
                    </div>
                    <div>
                        <label class="adm-label" for="prod-stock">Stock disponible *</label>
                        <input id="prod-stock" type="number" min="0" required class="adm-input" placeholder="Ej. 25" />
                    </div>
                </div>

                <div class="adm-form-row adm-campo">
                    <div>
                        <label class="adm-label" for="prod-etiqueta">Etiqueta</label>
                        <select id="prod-etiqueta" class="adm-select">
                            <option value="">Sin etiqueta</option>
                            <option value="NUEVO">Nuevo</option>
                            <option value="OFERTA">Oferta</option>
                            <option value="TENDENCIA">Tendencia</option>
                        </select>
                    </div>
                    <div id="prod-oferta-wrap" hidden>
                        <label class="adm-label" for="prod-precio-oferta">Precio oferta (en la moneda elegida) *</label>
                        <input id="prod-precio-oferta" type="number" step="0.01" min="0.01" class="adm-input" placeholder="Ej. 1999.99" />
                    </div>
                </div>

                <div class="adm-campo">
                    <label class="adm-label">Imagen del producto</label>
                    <div class="ap-media">
                        <button type="button" id="prod-img-tile" class="ap-media-tile ap-media--marco" aria-haspopup="dialog" title="Cambiar imagen">
                            <img id="prod-img-prev" alt="" hidden />
                            <span id="prod-img-vacio" class="ap-media-vacio">Sin imagen</span>
                            <span class="ap-media-overlay">Cambiar imagen</span>
                        </button>
                        <input type="hidden" id="prod-imagen" />
                        <div id="prod-img-picker" class="ap-picker" role="dialog" aria-label="Imagen del producto" hidden>
                            <div class="ap-picker-tabs" role="tablist" aria-label="Origen de la imagen">
                                <button type="button" class="ap-picker-tab is-active" data-ptab="url" role="tab">Enlace</button>
                                <button type="button" class="ap-picker-tab" data-ptab="pc" role="tab">Mi equipo</button>
                            </div>
                            <div data-ppanel="url">
                                <input id="prod-img-url" class="adm-input" placeholder="https://… o /uploads/xxx.png" inputmode="url" />
                                <button type="button" id="prod-img-usar" class="adm-btn adm-btn-primary adm-btn-sm ap-picker-usar">Usar enlace</button>
                            </div>
                            <div data-ppanel="pc" hidden>
                                <label id="prod-img-drop" class="ap-drop">
                                    <input id="prod-img-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
                                    <span>Arrastra aquí o <b>elige de tu PC</b><br /><small>PNG · JPG · WEBP · máx 5MB</small></span>
                                </label>
                                <span id="prod-img-estado" class="adm-sub"></span>
                            </div>
                            <div class="ap-picker-foot">
                                <button type="button" id="prod-img-quitar" class="adm-btn adm-btn-ghost adm-btn-sm">Quitar imagen</button>
                                <button type="button" id="prod-img-listo" class="adm-btn adm-btn-primary adm-btn-sm">Listo</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="adm-campo--ajustado">
                    <label class="adm-label" for="prod-descripcion">Descripción</label>
                    <textarea id="prod-descripcion" rows="3" class="adm-textarea" placeholder="Ej. Laptop con 16 GB de RAM y SSD de 512 GB…"></textarea>
                </div>

                <div class="adm-modal-foot">
                    <button type="button" id="btn-cancelar-modal" class="adm-btn adm-btn-ghost adm-btn-sm">
                        Cancelar
                    </button>
                    <button type="submit" id="btn-guardar-prod" class="adm-btn adm-btn-primary adm-btn-sm">
                        Guardar producto
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="adm-footer">
        <p>© 2026 ELECTRONIX — Módulo de Administración.</p>
    </footer>

    <script type="module" src="/assets/js/admin/productos.js?v=2"></script>
</body>
</html>
