<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Clientes — ELECTRONIX Admin</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <link rel="stylesheet" href="/assets/css/output.css">
    <script src="/assets/js/admin-theme.js"></script>
    <link rel="stylesheet" href="/assets/css/admin.css?v=2">
    <!-- librerias chat: es para el websocket -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <link rel="stylesheet" href="/assets/css/admin/chat.css?v=2">
    <link rel="stylesheet" href="/assets/css/ui/ui-inline.css?v=2">
</head>
<body class="adm">

    <header id="main-navbar"></header>

    <main class="adm-main">

        <div class="adm-pagehead">
            <div>
                <h1 class="adm-title">Chat con Clientes</h1>
                <p class="adm-subtitle">Atiende en tiempo real las conversaciones vía WebSocket STOMP</p>
            </div>
        </div>

        <div class="adm-card adm-chat">

            <aside class="adm-chat-side">
                <div class="adm-chat-side-head">
                    <span>Conversaciones</span>
                    <button id="btn-refrescar-convs" class="adm-refresh" title="Refrescar lista">
                        <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
                <div id="conversaciones-lista" class="adm-convs">
                    <div class="adm-msg-placeholder">Cargando conversaciones…</div>
                </div>
            </aside>

            <section class="adm-chat-main">
                <div class="adm-chat-head">
                    <span class="adm-avatar" id="chat-cliente-avatar">?</span>
                    <div>
                        <h3 id="chat-cliente-nombre">Selecciona una conversación</h3>
                        <p id="chat-cliente-estado">Canal en espera</p>
                    </div>
                </div>

                <div id="admin-chat-messages" class="adm-msgs">
                    <div class="adm-msg-placeholder">Selecciona un cliente de la lista para abrir la sesión de chat.</div>
                </div>

                <div class="adm-chat-foot">
                    <form id="admin-chat-form" class="adm-chat-form">
                        <input id="admin-chat-input" type="text" placeholder="Escribe una respuesta para el cliente…" disabled
                               class="adm-input" autocomplete="off" />
                        <button type="submit" id="admin-chat-send" disabled class="adm-btn adm-btn-primary">
                            Enviar
                        </button>
                    </form>
                </div>
            </section>

        </div>

    </main>

    <footer class="adm-footer">
        <p>© 2026 ELECTRONIX — Módulo de Administración.</p>
    </footer>

    <script type="module" src="/assets/js/admin/chat.js?v=2"></script>
</body>
</html>
