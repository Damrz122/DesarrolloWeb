<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio — ELECTRONIX</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap">
    <link rel="stylesheet" href="/assets/css/output.css">
    <script src="/assets/js/admin-theme.js"></script>
    <link rel="stylesheet" href="/assets/css/admin.css?v=2">
    <link rel="stylesheet" href="/assets/css/admin/estudio.css?v=1">
    <script src="/assets/js/vendor/fabric-6.9.1.min.js"></script>
</head>
<body class="adm est-body">

    <header class="est-topbar">
        <a href="/admin/apariencia.html" class="adm-btn adm-btn-ghost adm-btn-sm" title="Volver a Ajustes">← Volver</a>
        <div class="est-topbar-title">
            <strong>Estudio</strong>
            <span id="est-bloque-nombre">Card</span>
        </div>
        <select id="est-bloque" class="adm-select est-select" aria-label="Bloque"></select>
        <div class="ap-seg est-vista" role="tablist" aria-label="Comparar">
            <button type="button" data-vista="antes" role="tab">Antes</button>
            <button type="button" data-vista="despues" role="tab" class="is-sel">Después</button>
        </div>
        <label class="ap-check"><input type="checkbox" id="est-hover" checked /> Hover</label>
        <div class="est-zoom">
            <button type="button" id="est-zoom-out" class="adm-btn adm-btn-ghost adm-btn-sm" title="Reducir zoom">−</button>
            <span id="est-zoom-nivel">100%</span>
            <button type="button" id="est-zoom-in" class="adm-btn adm-btn-ghost adm-btn-sm" title="Ampliar zoom">+</button>
        </div>
        <button type="button" id="est-add-texto" class="adm-btn adm-btn-ghost adm-btn-sm" title="Agregar texto">+ Texto</button>
        <button type="button" id="est-borrar" class="adm-btn adm-btn-ghost adm-btn-sm" title="Eliminar seleccionado">🗑</button>
        <button type="button" id="est-guardar" class="adm-btn adm-btn-primary adm-btn-sm">Guardar</button>
    </header>

    <main class="est-main">
        <div class="est-canvas-wrap" id="est-wrap">
            <canvas id="est-canvas"></canvas>
        </div>

        <aside class="est-panel" aria-label="Propiedades">
            <p class="ap-group"><span></span>Seleccionado</p>
            <p class="est-sel-nombre" id="est-sel-nombre">Nada seleccionado</p>
            <div class="ap-grid2">
                <div>
                    <div class="ap-row"><span>X</span><span class="ap-val" data-v-x></span></div>
                    <input type="range" id="est-x" min="0" max="100" step="0.5" />
                </div>
                <div>
                    <div class="ap-row"><span>Y</span><span class="ap-val" data-v-y></span></div>
                    <input type="range" id="est-y" min="0" max="100" step="0.5" />
                </div>
                <div>
                    <div class="ap-row"><span>Ancho</span><span class="ap-val" data-v-w></span></div>
                    <input type="range" id="est-w" min="5" max="100" step="0.5" />
                </div>
                <div>
                    <div class="ap-row"><span>Rotación</span><span class="ap-val" data-v-rot></span></div>
                    <input type="range" id="est-rot" min="-45" max="45" step="1" />
                </div>
            </div>
            <div id="est-texto-props" hidden>
                <div class="ap-row"><span>Tamaño letra</span><span class="ap-val" data-v-size></span></div>
                <input type="range" id="est-size" min="8" max="40" step="1" />
                <div class="ap-row"><span>Alineación</span></div>
                <div class="ap-seg" id="est-align">
                    <button type="button" data-al="left">Izq</button>
                    <button type="button" data-al="center">Centro</button>
                    <button type="button" data-al="right">Der</button>
                </div>
            </div>
            <p class="ap-group"><span></span>Velo y fondo</p>
            <div class="ap-grid2">
                <div>
                    <div class="ap-row"><span>Oscuro</span><span class="ap-val" data-v-velo></span></div>
                    <input type="range" id="est-velo" min="0" max="95" step="1" />
                </div>
                <div>
                    <div class="ap-row"><span>Claro hover</span><span class="ap-val" data-v-veloHover></span></div>
                    <input type="range" id="est-veloHover" min="0" max="95" step="1" />
                </div>
            </div>
            <div class="ap-row"><span>Color sombra</span><span class="ap-val" data-v-veloColor></span></div>
            <div class="ap-color-row"><input type="color" id="est-veloColor" class="ap-color" /></div>
            <div class="ap-row"><span>Desenfoque</span><span class="ap-val" data-v-fondoBlur></span></div>
            <input type="range" id="est-fondoBlur" min="0" max="12" step="1" />
            <p class="adm-sub est-hint">Tip: doble click en un texto para escribir ahí mismo · rueda del mouse = zoom · Supr = eliminar</p>
        </aside>
    </main>

    <script type="module" src="/assets/js/admin/estudio.js?v=6"></script>
</body>
</html>
