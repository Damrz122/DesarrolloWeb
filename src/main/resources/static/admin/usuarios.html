<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios — ELECTRONIX Admin</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <link rel="stylesheet" href="/assets/css/output.css">
    <script src="/assets/js/admin-theme.js"></script>
    <link rel="stylesheet" href="/assets/css/admin.css?v=2">
    <link rel="stylesheet" href="/assets/css/ui/ui-inline.css?v=2">
</head>
<body class="adm">

    <header id="main-navbar"></header>

    <main class="adm-main">

        <div class="adm-pagehead">
            <div>
                <h1 class="adm-title">Usuarios registrados</h1>
                <p class="adm-subtitle">Crea cuentas, cambia roles, activa o desactiva y elimina usuarios</p>
            </div>
            <div class="adm-actions">
                <div>
                    <label class="adm-label adm-etiqueta-ajustada" for="filtro-rol">Rol</label>
                    <select id="filtro-rol" class="adm-select adm-select--filtro">
                        <option value="">Todos los roles</option>
                        <option value="ADMIN">Administradores</option>
                        <option value="CLIENTE">Clientes</option>
                    </select>
                </div>
                <div>
                    <label class="adm-label adm-etiqueta-ajustada" for="filtro-buscar">Buscar</label>
                    <input id="filtro-buscar" class="adm-input" type="text" placeholder="Ej. nombre o correo…" />
                </div>
                <div style="align-self:flex-end">
                    <button id="btn-nuevo-usuario" class="adm-btn adm-btn-primary" type="button">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Nuevo usuario
                    </button>
                </div>
            </div>
        </div>

        <div class="adm-card">
            <div class="adm-table-wrap">
                <table class="adm-table">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Documento</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Registro</th>
                            <th class="num">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usuarios-table-body" class="adm-fade">
                        <tr>
                            <td colspan="6" class="adm-empty">Cargando usuarios…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="usuarios-pager" class="adm-pager" hidden></div>
        </div>

    </main>

    <footer class="adm-footer">
        <p>© 2026 ELECTRONIX — Módulo de Administración.</p>
    </footer>

    <div id="modal-usuario" class="adm-modal-backdrop hidden">
        <div class="adm-modal adm-modal--ancho">
            <div class="adm-modal-head">
                <h3 class="adm-modal-title" id="modal-usr-title">Nuevo usuario</h3>
                <button id="modal-usr-close" class="adm-close" aria-label="Cerrar" type="button">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="form-nuevo-usuario" class="adm-form-grid" novalidate>
                <input id="nu-id" type="hidden" value="" />
                <div class="adm-field">
                    <label class="adm-label" for="nu-nombres">Nombres *</label>
                    <input id="nu-nombres" class="adm-input" type="text" required minlength="2" maxlength="100" placeholder="Ej. Maria" />
                </div>
                <div class="adm-field">
                    <label class="adm-label" for="nu-paterno">Apellido paterno *</label>
                    <input id="nu-paterno" class="adm-input" type="text" required minlength="2" maxlength="100" placeholder="Ej. Gomez" />
                </div>
                <div class="adm-field">
                    <label class="adm-label" for="nu-materno">Apellido materno</label>
                    <input id="nu-materno" class="adm-input" type="text" maxlength="100" placeholder="Opcional" />
                </div>
                <div class="adm-field" id="nu-rol-wrap">
                    <label class="adm-label" for="nu-rol">Rol *</label>
                    <select id="nu-rol" class="adm-select">
                        <option value="CLIENTE">Cliente</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                <div class="adm-field">
                    <label class="adm-label" for="nu-tipodoc">Tipo documento *</label>
                    <select id="nu-tipodoc" class="adm-select">
                        <option value="DNI">DNI</option>
                        <option value="CE">CE</option>
                    </select>
                </div>
                <div class="adm-field">
                    <label class="adm-label" for="nu-doc">N° documento *</label>
                    <input id="nu-doc" class="adm-input" type="text" required placeholder="8 dígitos DNI / 9 CE" />
                </div>
                <div class="adm-field adm-field--full">
                    <label class="adm-label" for="nu-email">Email *</label>
                    <input id="nu-email" class="adm-input" type="email" required placeholder="usuario@correo.com" />
                </div>
                <div class="adm-field adm-field--full">
                    <label class="adm-label" for="nu-pass" id="nu-pass-label">Contraseña * (mín. 6)</label>
                    <input id="nu-pass" class="adm-input" type="password" required minlength="6" placeholder="••••••••" />
                </div>
                <div class="adm-modal-foot adm-field--full">
                    <button type="button" id="modal-usr-cancel" class="adm-btn adm-btn-ghost">Cancelar</button>
                    <button type="submit" id="btn-crear-usuario" class="adm-btn adm-btn-primary">Crear usuario</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/assets/js/admin/usuarios.js?v=2"></script>
</body>
</html>
