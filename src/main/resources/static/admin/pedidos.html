<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos — ELECTRONIX Admin</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <link rel="stylesheet" href="/assets/css/output.css">
    <script src="/assets/js/admin-theme.js"></script>
    <link rel="stylesheet" href="/assets/css/admin.css?v=2">
    <link rel="stylesheet" href="/assets/css/admin/pedidos.css?v=2">
    <link rel="stylesheet" href="/assets/css/ui/ui-inline.css?v=2">
</head>
<body class="adm">

    <header id="main-navbar"></header>

    <main class="adm-main">

        <div class="adm-pagehead">
            <div>
                <h1 class="adm-title">Control de órdenes y envíos</h1>
                <p class="adm-subtitle">Supervisa y actualiza el estado logístico de cada pedido</p>
            </div>
            <div class="adm-actions">
                <div>
                    <label class="adm-label adm-etiqueta-ajustada" for="filtro-estado">Estado</label>
                    <select id="filtro-estado" class="adm-select adm-select--filtro">
                        <option value="">Todos los estados</option>
                        <option value="PENDIENTE">Pendientes</option>
                        <option value="EN_PROCESO">En proceso</option>
                        <option value="ENVIADO">Enviados</option>
                        <option value="ENTREGADO">Entregados</option>
                        <option value="CANCELADO">Cancelados</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="adm-card">
            <div class="adm-table-wrap">
                <table class="adm-table">
                    <thead>
                        <tr>
                            <th>Pedido</th>
                            <th>Cliente</th>
                            <th>Total</th>
                            <th>Destino / Teléfono</th>
                            <th>Estado actual</th>
                            <th>Cambiar estado</th>
                            <th class="num">Detalle</th>
                        </tr>
                    </thead>
                    <tbody id="pedidos-table-body" class="adm-fade">
                        <tr>
                            <td colspan="7" class="adm-empty">Cargando órdenes…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="pedidos-pager" class="adm-pager" hidden></div>
        </div>

    </main>

    <!-- modal: es para ver el detalle del pedido -->
    <div id="modal-pedido" class="adm-modal-backdrop hidden">
        <div class="adm-modal adm-modal--ancho">
            <div class="adm-modal-head">
                <h3 id="modal-ped-title" class="adm-modal-title">Detalle de pedido</h3>
                <button id="modal-ped-close" class="adm-close" aria-label="Cerrar">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="modal-ped-content"></div>
        </div>
    </div>

    <footer class="adm-footer">
        <p>© 2026 ELECTRONIX — Módulo de Administración.</p>
    </footer>

    <script type="module" src="/assets/js/admin/pedidos.js?v=2"></script>
</body>
</html>
