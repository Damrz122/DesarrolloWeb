<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías — ELECTRONIX Admin</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <link rel="stylesheet" href="/assets/css/output.css">
    <script src="/assets/js/admin-theme.js"></script>
    <link rel="stylesheet" href="/assets/css/admin.css?v=2">
    <link rel="stylesheet" href="/assets/css/admin/categorias.css?v=2">
    <link rel="stylesheet" href="/assets/css/ui/ui-inline.css?v=2">
</head>
<body class="adm">

    <header id="main-navbar"></header>

        <main class="adm-main">

        <div class="adm-pagehead">
            <div>
                <h1 class="adm-title">Categorías de productos</h1>
                <p class="adm-subtitle">Organiza la estructura de navegación del catálogo</p>
            </div>
            <div class="adm-actions">
                <button id="btn-nueva-cat" class="adm-btn adm-btn-primary">
                    <span>Nueva categoría</span>
                </button>
            </div>
        </div>

        <div class="adm-card">
            <div class="adm-table-wrap">
                <table class="adm-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th class="num">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="categorias-table-body" class="adm-fade">
                        <tr>
                            <td colspan="4" class="adm-empty">Cargando categorías…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="categorias-pager" class="adm-pager" hidden></div>
        </div>

    </main>

    <!-- modal: es para crear y editar categorias -->
    <div id="cat-modal" class="adm-modal-backdrop hidden">
        <div class="adm-modal adm-modal--sm">
            <div class="adm-modal-head">
                <h3 id="cat-modal-title" class="adm-modal-title">Nueva categoría</h3>
                <button id="cat-modal-close" class="adm-close" aria-label="Cerrar">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <form id="cat-form">
                <input type="hidden" id="cat-id" />

                <div class="adm-campo">
                    <label class="adm-label" for="cat-nombre">Nombre de categoría *</label>
                    <input id="cat-nombre" type="text" required class="adm-input" placeholder="Ej. Laptops y Computadoras" />
                </div>

                <div class="adm-campo--ajustado">
                    <label class="adm-label" for="cat-descripcion">Descripción</label>
                    <textarea id="cat-descripcion" rows="3" class="adm-textarea" placeholder="Ej. Portátiles para trabajo y gaming…"></textarea>
                </div>

                <div class="adm-modal-foot">
                    <button type="button" id="btn-cat-cancelar" class="adm-btn adm-btn-ghost adm-btn-sm">
                        Cancelar
                    </button>
                    <button type="submit" class="adm-btn adm-btn-primary adm-btn-sm">
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="adm-footer">
        <p>© 2026 ELECTRONIX — Módulo de Administración.</p>
    </footer>

    <script type="module" src="/assets/js/admin/categorias.js?v=2"></script>
</body>
</html>
