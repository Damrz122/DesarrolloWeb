<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra — ELECTRONIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/output.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body class="bg-[#eaebed] text-neutral-800 min-h-screen flex flex-col antialiased">

    <div id="main-navbar"></div>

    <main class="max-w-4xl mx-auto px-4 sm:px-8 py-8 flex-1 w-full">
        <div class="mb-6">
            <h1 class="text-2xl sm:text-3xl font-black text-neutral-900 uppercase">Confirmación y Entrega</h1>
            <p class="text-xs text-neutral-500 mt-1">Completa los datos de destino para procesar tu orden en Electronix</p>
        </div>

        <div id="checkout-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
            
            <!-- Formulario de Envío -->
            <div class="bg-white p-6 sm:p-8 rounded-2xl border border-neutral-200 shadow-md">
                <h2 class="text-base font-black text-neutral-900 mb-4 flex items-center space-x-2 uppercase">
                    <svg class="w-5 h-5 text-[#14635c]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span>Datos de Envío</span>
                </h2>

                <form id="checkout-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-neutral-700 mb-1">Dirección de entrega *</label>
                        <input id="checkout-address" type="text" placeholder="Ej. Av. Javier Prado Este 1234, Dpto 502" required
                               class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-4 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#14635c] transition-colors" />
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-neutral-700 mb-1">Teléfono de contacto *</label>
                        <input id="checkout-phone" type="tel" placeholder="Ej. 987654321" required
                               class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-4 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#14635c] transition-colors" />
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-neutral-700 mb-1">Método de entrega</label>
                        <div class="p-3 bg-neutral-50 rounded-xl border border-neutral-200 flex items-center justify-between">
                            <span class="text-xs font-semibold text-neutral-800">Despacho Express a Domicilio</span>
                            <span class="text-xs font-bold text-emerald-600">Gratis</span>
                        </div>
                    </div>

                    <button type="submit" id="btn-confirm-order" class="w-full mt-2 bg-[#14635c] hover:bg-[#1ca299] text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition-all flex items-center justify-center space-x-2">
                        <span>Confirmar y Generar Pedido</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    </button>
                </form>
            </div>

            <!-- Resumen de Compra -->
            <div class="bg-white p-6 sm:p-8 rounded-2xl border border-neutral-200 shadow-md space-y-6">
                <h2 class="text-base font-black text-neutral-900 border-b border-neutral-100 pb-3 uppercase">Resumen de Compra</h2>
                
                <div id="checkout-items" class="space-y-3 max-h-64 overflow-y-auto pr-1 text-sm">
                </div>

                <div class="border-t border-neutral-200 pt-4 space-y-2 text-sm">
                    <div class="flex justify-between text-neutral-600 text-xs">
                        <span>Subtotal</span>
                        <span id="checkout-subtotal" class="font-bold text-neutral-900">S/ 0.00</span>
                    </div>
                    <div class="flex justify-between text-neutral-600 text-xs">
                        <span>Envío</span>
                        <span class="font-bold text-emerald-600">S/ 0.00</span>
                    </div>
                    <div class="flex justify-between items-baseline pt-2 border-t border-neutral-200 text-base">
                        <span class="text-sm font-bold text-neutral-800 uppercase">Total</span>
                        <span id="checkout-total" class="text-2xl font-black text-neutral-900">S/ 0.00</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="border-t border-neutral-200 bg-white py-6 text-center text-xs text-neutral-500 mt-auto">
        <p>© 2026 ELECTRONIX. Todos los derechos reservados.</p>
    </footer>

    <script type="module">
        import { api } from '/assets/js/api.js';
        import { auth } from '/assets/js/auth.js';
        import { cart } from '/assets/js/cart.js';
        import { renderNavbar } from '/assets/js/ui/navbar.js';
        import { showToast } from '/assets/js/ui/toast.js';

        renderNavbar();

        if (!auth.protegerRutaAutenticada()) {
            // Guard
        } else {
            initCheckout();
        }

        async function initCheckout() {
            const itemsContainer = document.getElementById('checkout-items');
            const subtotalEl = document.getElementById('checkout-subtotal');
            const totalEl = document.getElementById('checkout-total');
            const form = document.getElementById('checkout-form');
            const confirmBtn = document.getElementById('btn-confirm-order');

            try {
                const datos = await cart.obtenerCarrito();
                if (!datos || !datos.items || datos.items.length === 0) {
                    showToast('Tu carrito está vacío. Agrega productos primero.', 'warning');
                    setTimeout(() => window.location.href = '/index.html', 1000);
                    return;
                }

                const totalFormateado = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }).format(datos.total);
                subtotalEl.textContent = totalFormateado;
                totalEl.textContent = totalFormateado;

                itemsContainer.innerHTML = '';
                datos.items.forEach(item => {
                    const sub = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }).format(item.subtotal);
                    itemsContainer.innerHTML += `
                        <div class="flex justify-between items-center py-2 border-b border-neutral-100">
                            <div>
                                <span class="font-bold text-neutral-900 block text-xs">${item.productoNombre}</span>
                                <span class="text-[11px] text-neutral-500">${item.cantidad} x S/ ${item.precioUnitario}</span>
                            </div>
                            <span class="font-bold text-neutral-900 text-xs">${sub}</span>
                        </div>
                    `;
                });

                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    confirmBtn.disabled = true;
                    confirmBtn.innerHTML = `
                        <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                        <span>Generando orden...</span>
                    `;

                    const direccion = document.getElementById('checkout-address').value.trim();
                    const telefono = document.getElementById('checkout-phone').value.trim();

                    try {
                        const res = await api.post('/api/pedidos', {
                            direccionEnvio: direccion,
                            telefono: telefono
                        });

                        if (res.exito && res.datos) {
                            showToast('¡Pedido #' + res.datos.id + ' generado exitosamente!', 'success');
                            cart.actualizarBadge(0);
                            setTimeout(() => {
                                window.location.href = '/mis-pedidos.html';
                            }, 1200);
                        } else {
                            throw new Error(res.mensaje || 'Error al procesar el pedido');
                        }
                    } catch (err) {
                        showToast(err.message, 'error');
                        confirmBtn.disabled = false;
                        confirmBtn.innerHTML = `
                            <span>Confirmar y Generar Pedido</span>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        `;
                    }
                });

            } catch (err) {
                showToast('Error cargando orden: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
