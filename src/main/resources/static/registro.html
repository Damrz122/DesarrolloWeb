<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta — ELECTRONIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/output.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body class="bg-[#eaebed] text-neutral-800 min-h-screen flex flex-col antialiased">

    <header id="main-navbar" class="elx-header">
        <div class="elx-topbar">
            <div class="elx-container elx-topbar-inner">
                <span class="elx-brand-tag">ELECTRONIX</span>
                <span class="elx-topbar-promo">ENVIO GRATIS POR COMPRA MAYOR A S/ 199</span>
                <div class="elx-topbar-actions">
                    <div class="elx-country-badge">
                        <span class="elx-per-flag"><span class="red"></span><span class="white"></span><span class="red"></span></span>
                        <span>PER</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="elx-mainbar">
            <div class="elx-container elx-mainbar-inner">
                <a href="/index.html" class="elx-logo-link" title="ELECTRONIX">
                    <svg class="elx-logo-svg" viewBox="0 0 100 90" fill="currentColor">
                        <path d="M15 12h65c4 0 7 3 7 7s-3 7-7 7H38l-4 12h32c3 0 6 3 5 7l-4 10c-1 3-3 5-6 5H24l-6 18c-1 3-4 5-8 5s-6-3-5-7L15 12z" />
                        <polygon points="68,28 48,50 62,50 42,75 50,56 36,56" fill="#1ca299" />
                        <circle cx="42" cy="82" r="6" fill="#1ca299" />
                        <circle cx="68" cy="82" r="6" fill="#1ca299" />
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 w-full my-8">
        <div class="bg-white w-full max-w-md p-6 sm:p-8 rounded-2xl border border-neutral-200 shadow-xl space-y-6">
            
            <div class="text-center">
                <div class="w-12 h-12 rounded-xl bg-[#0b2e2b] text-[#1ca299] flex items-center justify-center mx-auto mb-3 shadow-md">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                </div>
                <h1 class="text-2xl font-black text-neutral-900 tracking-tight uppercase">Crea tu Cuenta</h1>
                <p class="text-xs text-neutral-500 mt-1">Regístrate en Electronix para comprar con envíos gratis</p>
            </div>

            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-neutral-700 mb-1.5">Nombres</label>
                    <input id="reg-nombres" type="text" placeholder="Ej. Ana María" required minlength="2" maxlength="100"
                           class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-4 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#14635c] transition-colors" />
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-neutral-700 mb-1.5">Apellido Paterno</label>
                        <input id="reg-paterno" type="text" placeholder="Ej. Morales" required minlength="2" maxlength="100"
                               class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-4 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#14635c] transition-colors" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-neutral-700 mb-1.5">Apellido Materno</label>
                        <input id="reg-materno" type="text" placeholder="Ej. Quispe (opcional)" maxlength="100"
                               class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-4 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#14635c] transition-colors" />
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-neutral-700 mb-1.5">Tipo de documento</label>
                    <div class="grid grid-cols-[110px_1fr] gap-2">
                        <select id="reg-tipodoc"
                                class="bg-neutral-50 border border-neutral-300 rounded-xl px-2 py-2.5 text-sm text-neutral-900 focus:outline-none focus:border-[#14635c] transition-colors">
                            <option value="DNI" selected>DNI</option>
                            <option value="CE">CE</option>
                        </select>
                        <input id="reg-numdoc" type="text" placeholder="N° de documento" required maxlength="12"
                               class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-4 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#14635c] transition-colors" />
                    </div>
                    <p class="text-[11px] text-neutral-400 mt-1">DNI: 8 dígitos. CE (carné de extranjería): 9 caracteres.</p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-neutral-700 mb-1.5">Correo Electrónico</label>
                    <input id="reg-email" type="email" placeholder="ana@ejemplo.com" required
                           class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-4 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#14635c] transition-colors" />
                </div>

                <div>
                    <label class="block text-xs font-bold text-neutral-700 mb-1.5">Contraseña</label>
                    <input id="reg-pass" type="password" placeholder="Mínimo 6 caracteres" minlength="6" required
                           class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-4 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#14635c] transition-colors" />
                </div>

                <button type="submit" id="btn-submit-reg" class="w-full bg-[#14635c] hover:bg-[#1ca299] text-white font-bold py-3 px-6 rounded-xl shadow-md transition-all flex items-center justify-center space-x-2">
                    <span>Registrarse</span>
                </button>
            </form>

            <div class="text-center text-xs text-neutral-500 pt-2 border-t border-neutral-100">
                ¿Ya tienes una cuenta? 
                <a href="/login.html" class="text-[#14635c] font-bold hover:underline">Inicia sesión</a>
            </div>

        </div>
    </main>

    <footer class="border-t border-neutral-200 bg-white py-6 text-center text-xs text-neutral-500 mt-auto">
        <p>© 2026 ELECTRONIX. Todos los derechos reservados.</p>
    </footer>

    <script type="module">
        import { auth } from '/assets/js/auth.js';
        import { renderNavbar } from '/assets/js/ui/navbar.js';

        renderNavbar();

        const form = document.getElementById('register-form');
        const nombresInput = document.getElementById('reg-nombres');
        const paternoInput = document.getElementById('reg-paterno');
        const maternoInput = document.getElementById('reg-materno');
        const tipoDocInput = document.getElementById('reg-tipodoc');
        const numDocInput = document.getElementById('reg-numdoc');
        const emailInput = document.getElementById('reg-email');
        const passInput = document.getElementById('reg-pass');
        const submitBtn = document.getElementById('btn-submit-reg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                <span>Creando cuenta...</span>
            `;

            try {
                const datos = {
                    nombres: nombresInput.value.trim(),
                    apellidoPaterno: paternoInput.value.trim(),
                    apellidoMaterno: maternoInput.value.trim() || null,
                    tipoDocumento: tipoDocInput.value,
                    numeroDocumento: numDocInput.value.trim(),
                    email: emailInput.value.trim(),
                    password: passInput.value
                };

                await auth.registro(datos);

                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 800);

            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Registrarse</span>`;
            }
        });
    </script>
</body>
</html>
