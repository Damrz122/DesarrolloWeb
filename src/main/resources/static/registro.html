<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta — NovaStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/output.css">
    <!-- SockJS & StompJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

    <header id="main-navbar"></header>

    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 w-full">
        <div class="glass-panel w-full max-w-md p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6">
            
            <div class="text-center">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center mx-auto mb-3 shadow-lg shadow-indigo-500/25">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                </div>
                <h1 class="text-2xl font-black text-white tracking-tight">Crea tu Cuenta</h1>
                <p class="text-xs text-slate-400 mt-1">Sé parte de NovaStore y gestiona tus pedidos online</p>
            </div>

            <!-- Formulario de Registro -->
            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Nombre Completo</label>
                    <input id="reg-name" type="text" placeholder="Ej. Ana Morales" required
                           class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors" />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Correo Electrónico</label>
                    <input id="reg-email" type="email" placeholder="ana@ejemplo.com" required
                           class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors" />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Contraseña</label>
                    <input id="reg-pass" type="password" placeholder="Mínimo 6 caracteres" minlength="6" required
                           class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors" />
                </div>

                <button type="submit" id="btn-submit-reg" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 transition-all transform hover:-translate-y-0.5">
                    <span>Registrarse</span>
                </button>
            </form>

            <div class="text-center text-xs text-slate-400 pt-2 border-t border-slate-800">
                ¿Ya tienes una cuenta? 
                <a href="/login.html" class="text-indigo-400 font-semibold hover:underline">Inicia sesión</a>
            </div>

        </div>
    </main>

    <footer class="border-t border-slate-800/80 bg-slate-950 py-6 text-center text-xs text-slate-500">
        <p>© 2026 NovaStore.</p>
    </footer>

    <script type="module">
        import { auth } from '/assets/js/auth.js';
        import { renderNavbar } from '/assets/js/ui/navbar.js';
        import { showToast } from '/assets/js/ui/toast.js';

        renderNavbar();

        const form = document.getElementById('register-form');
        const nameInput = document.getElementById('reg-name');
        const emailInput = document.getElementById('reg-email');
        const passInput = document.getElementById('reg-pass');
        const submitBtn = document.getElementById('btn-submit-reg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                <span>Creando cuenta...</span>
            `;

            try {
                const nombre = nameInput.value.trim();
                const email = emailInput.value.trim();
                const pass = passInput.value;

                await auth.registro(nombre, email, pass);

                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 800);

            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Registrarse</span>`;
            }
        });
    </script>
</body>
</html>
