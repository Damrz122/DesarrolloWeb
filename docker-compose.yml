services:
  ecommerce-postgres:
    image: postgres:16-alpine
    container_name: electronix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5435:5432"
    volumes:
      - electronix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  ecommerce-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: electronix-app
    restart: unless-stopped
    depends_on:
      ecommerce-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://ecommerce-postgres:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
    ports:
      - "8090:8080"

  ecommerce-adminer:
    image: adminer:latest
    container_name: electronix-adminer
    restart: unless-stopped
    ports:
      - "8091:8080"
    depends_on:
      - ecommerce-postgres

volumes:
  electronix_postgres_data:
